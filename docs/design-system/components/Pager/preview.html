<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>Pager — preview</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
		/>
		<style>
			body {
				margin: 0;
				background: var(--tint-2, #eef3ff);
			}
			.pad {
				padding: 16px;
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: flex-start;
			}
		</style>
	</head>
	<body class="bf-root">
		<div class="pad" style="flex-direction: column; align-items: stretch; max-width: 720px">
			<nav class="bf-pager bf-pager--md" aria-label="Halaman rencana">
				<span class="bf-pager__info">Menampilkan rencana 1–3 dari 5</span
				><button type="button" disabled>
					<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M15 6l-6 6 6 6"></path></svg
					>Sebelumnya</button
				><button type="button" aria-current="page">1</button><button type="button">2</button
				><button type="button">
					Berikutnya<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M9 6l6 6-6 6"></path>
					</svg>
				</button>
			</nav>
			<nav
				class="bf-pager bf-pager--sm"
				aria-label="Halaman langkah"
				style="background: var(--surface, #fff); padding: 10px 14px; border-radius: 14px"
			>
				<span class="bf-pager__info">Langkah 5–6 dari 6</span
				><button type="button" aria-label="Langkah sebelumnya">
					<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M15 6l-6 6 6 6"></path>
					</svg></button
				><button type="button">1</button><button type="button" aria-current="page">2</button
				><button type="button" aria-label="Langkah berikutnya" disabled>
					<svg
						width="14"
						height="14"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true"
					>
						<path d="M9 6l6 6-6 6"></path>
					</svg>
				</button>
			</nav>
		</div>
	</body>
</html>
