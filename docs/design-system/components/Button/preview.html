<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>Button — preview</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap"
		/>
		<style>
			body {
				margin: 0;
				background: var(--tint-2, #eef3ff);
			}
			.pad {
				padding: 16px;
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				align-items: flex-start;
			}
		</style>
	</head>
	<body class="bf-root">
		<div class="pad">
			<button class="bf-btn bf-btn--primary" type="button">Buat Proyek</button>
			<button class="bf-btn bf-btn--secondary" type="button">Nanti saja</button>
			<button class="bf-btn bf-btn--dark" type="button">Lihat Solusi</button>
			<button class="bf-btn bf-btn--ghost" type="button">Lihat semua</button>
			<button class="bf-btn bf-btn--income bf-btn--sm" type="button">+ Pemasukan</button>
			<button class="bf-btn bf-btn--expense bf-btn--sm" type="button">+ Pengeluaran</button>
			<button class="bf-btn bf-btn--ai bf-btn--sm" type="button">Minta saran AI</button>
			<button class="bf-btn bf-btn--primary bf-btn--pill" type="button">Konsultasi Gratis</button>
			<button class="bf-btn bf-btn--secondary" type="button" disabled>Berikutnya</button>
		</div>
	</body>
</html>
